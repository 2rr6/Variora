<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7ecda">
  <title>Pelican Cycle — A coastal ride</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #254c50;
      background: #f7ecda;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 92% 4%, #fff8e8 0, transparent 28rem),
        #f7ecda;
    }

    .page {
      width: min(100%, 1500px);
      margin: 0 auto;
      padding: clamp(20px, 4vw, 58px);
    }

    .topline {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: clamp(22px, 3vw, 38px);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #bc6d4d;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 5.8vw, 5.7rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    .topline-right {
      display: flex;
      align-items: center;
      gap: 22px;
      padding-bottom: 4px;
    }

    .route-label {
      margin: 0;
      color: #69817c;
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      line-height: 1.6;
      text-align: right;
      text-transform: uppercase;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 17px;
      border: 1.5px solid #335c5b;
      border-radius: 100px;
      background: #fff8eb;
      color: #254c50;
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 3px 0 #335c5b;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #335c5b; }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #335c5b; }
    button:focus-visible { outline: 3px solid #e88b54; outline-offset: 4px; }
    button[hidden] { display: none; }

    .control-symbol { width: 1em; font-size: 0.95rem; line-height: 1; }

    .scene {
      overflow: hidden;
      border: 5px solid #fffaf0;
      border-radius: clamp(18px, 2.8vw, 34px);
      background: #f8cba8;
      box-shadow: 0 24px 65px #8e78613b, 0 0 0 1px #ddc9aa;
    }

    .scene svg { display: block; width: 100%; height: auto; }

    .cloud-a { animation: cloud-a 15s ease-in-out infinite alternate; }
    .cloud-b { animation: cloud-b 19s ease-in-out infinite alternate; }
    .wave { animation: wave 3.2s linear infinite; }
    .road-markings { animation: road 0.9s linear infinite; }
    .wind-mark { animation: wind 2.5s ease-in-out infinite; }
    .wind-mark:nth-child(2) { animation-delay: -1.2s; }

    @keyframes cloud-a { to { transform: translate(34px, -8px); } }
    @keyframes cloud-b { to { transform: translate(-46px, 5px); } }
    @keyframes wave { to { stroke-dashoffset: -80; } }
    @keyframes road { to { transform: translateX(-160px); } }
    @keyframes wind { 50% { opacity: 0.26; transform: translateX(-15px); } }

    body.is-paused .scene * { animation-play-state: paused !important; }

    @media (prefers-reduced-motion: reduce) {
      body:not(.motion-opt-in) .scene * { animation-play-state: paused !important; }
      button { transition: none; }
    }

    .footnote {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 22px;
      color: #6b817a;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .footnote p { margin: 0; }

    @media (max-width: 680px) {
      .topline { align-items: start; flex-direction: column; }
      .topline-right { width: 100%; justify-content: space-between; }
      .route-label { text-align: left; }
      .footnote { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>

      <p>An endless coastal commute</p>

  <script>
    (() => {
      const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      const toggle = document.getElementById('motion-toggle');
      const symbol = toggle.querySelector('.control-symbol');
      const label = toggle.querySelector('.control-label');
      const pelican = document.getElementById('pelican');
      const crank = document.getElementById('crank-arms');
      const rearSpokes = document.getElementById('rear-spokes');
      const frontSpokes = document.getElementById('front-spokes');
      const legs = [document.getElementById('front-leg'), document.getElementById('back-leg')];
      const center = { x: 600, y: 530 };
      const radius = 44;
      const twoPi = Math.PI * 2;
      let elapsed = 0.16;
      let previousTime = null;
      let animationFrame = null;
      let playing = !motionQuery.matches;

      function setLeg(group, hip, foot) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const reach = Math.min(distance, 239.9);
        const along = reach / 2;
        const bend = Math.sqrt(120 * 120 - along * along);
        const kneeX = hip.x + dx / distance * along + dy / distance * bend;
        const kneeY = hip.y + dy / distance * along - dx / distance * bend;
        group.querySelector('.leg-path').setAttribute('d', `M${hip.x} ${hip.y} L${kneeX} ${kneeY} L${foot.x} ${foot.y}`);
        group.querySelector('.pedal').setAttribute('d', `M${foot.x - 15} ${foot.y + 9} h45`);
        group.querySelector('.foot').setAttribute('d', `M${foot.x - 11} ${foot.y - 5} Q${foot.x + 5} ${foot.y - 14} ${foot.x + 21} ${foot.y - 8} Q${foot.x + 36} ${foot.y - 4} ${foot.x + 35} ${foot.y + 4} Q${foot.x + 27} ${foot.y + 10} ${foot.x - 6} ${foot.y + 7} Z`);
      }

      function render(time) {
        const angle = time * twoPi / 1.28 - 1.15;
        const bob = Math.sin(angle * 2) * 2.2;
        const frontFoot = { x: center.x + radius * Math.cos(angle), y: center.y + radius * Math.sin(angle) };
        const backFoot = { x: center.x - radius * Math.cos(angle), y: center.y - radius * Math.sin(angle) };
        pelican.setAttribute('transform', `translate(0 ${bob})`);
        setLeg(legs[0], { x: 586, y: 372 + bob }, frontFoot);
        setLeg(legs[1], { x: 560, y: 368 + bob }, backFoot);
        crank.setAttribute('d', `M${backFoot.x} ${backFoot.y} L600 530 ${frontFoot.x} ${frontFoot.y}`);
        const wheelAngle = time * 360 / 2.7;
        rearSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
        frontSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
      }

      function updateButton() {
        symbol.textContent = playing ? 'Ⅱ' : '▶';
        label.textContent = playing ? 'Pause motion' : 'Play motion';
        toggle.setAttribute('aria-label', playing ? 'Pause animation' : 'Play animation');
      }

      function tick(now) {
        if (previousTime !== null) elapsed += Math.min((now - previousTime) / 1000, 0.05);
        previousTime = now;
        render(elapsed);
        if (playing) animationFrame = requestAnimationFrame(tick);
      }

      function pause() {
        playing = false;
        cancelAnimationFrame(animationFrame);
        previousTime = null;
        document.body.classList.add('is-paused');
        updateButton();
      }

      function play() {
        playing = true;
        previousTime = null;
        document.body.classList.remove('is-paused');
        document.body.classList.add('motion-opt-in');
        updateButton();
        animationFrame = requestAnimationFrame(tick);
      }

      toggle.hidden = false;
      toggle.addEventListener('click', () => playing ? pause() : play());
      motionQuery.addEventListener('change', event => { if (event.matches) pause(); });
      render(elapsed);
      updateButton();
      if (playing) animationFrame = requestAnimationFrame(tick);
      else document.body.classList.add('is-paused');
    })();
  </script>
</body>
</html>
