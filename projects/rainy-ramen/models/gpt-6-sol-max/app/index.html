<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10152c">
  <meta name="description" content="A small midnight story: a cat, a robot, one bowl of ramen, and a very rainy night.">
  <title>Rainy Ramen — a small midnight story</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #10152c;
      color: #fff5e3;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { overflow: hidden; }
    button { font: inherit; }
    .scene {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 530px;
      overflow: hidden;
      background: radial-gradient(circle at 63% 45%, #283653 0, #11162e 57%, #0b1026 100%);
    }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      box-shadow: inset 0 0 140px 45px rgba(5, 8, 25, .64);
    }
    .art {
      display: block;
      width: 100%;
      height: 100%;
    }
    .heading {
      position: absolute;
      z-index: 4;
      top: clamp(25px, 5vh, 58px);
      left: clamp(26px, 5.6vw, 94px);
      max-width: min(42vw, 470px);
      pointer-events: none;
      text-shadow: 0 3px 23px #091125, 0 2px 3px #091125;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #b6e5e9;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .29em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 21px;
      height: 1px;
      background: #80dadd;
      box-shadow: 0 0 8px #80dadd;
    }
    h1 {
      margin: 12px 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 6.6vw, 98px);
      font-weight: 400;
      letter-spacing: -.066em;
      line-height: .91;
      white-space: nowrap;
    }
    h1 em {
      color: #ffb2a3;
      font-weight: 400;
    }
    .heading p {
      margin: 15px 0 0;
      color: #cad7e3;
      font-size: clamp(11px, 1.08vw, 15px);
      letter-spacing: .08em;
      line-height: 1.45;
    }
    .controls {
      position: absolute;
      z-index: 5;
      bottom: clamp(19px, 3.4vh, 38px);
      left: clamp(22px, 5.4vw, 92px);
      display: flex;
      gap: 8px;
    }
    .control {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 39px;
      padding: 0 16px;
      border: 1px solid rgba(174, 230, 228, .46);
      border-radius: 40px;
      background: rgba(11, 23, 42, .69);
      color: #edfbf4;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: background .2s, border-color .2s, transform .2s;
      backdrop-filter: blur(10px);
    }
    .control:hover {
      transform: translateY(-2px);
      background: rgba(22, 47, 66, .92);
      border-color: #aee6e4;
    }
    .control:focus-visible { outline: 3px solid #ffd7ad; outline-offset: 3px; }
    .control[aria-pressed="true"] {
      color: #102437;
      border-color: #f2c9a6;
      background: #f2c9a6;
    }
    .control svg { width: 17px; height: 17px; flex: none; }
    .corner-note {
      position: absolute;
      z-index: 4;
      right: clamp(23px, 5.6vw, 94px);
      bottom: clamp(23px, 3.9vh, 43px);
      color: #a7c9cd;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .25em;
      text-align: right;
      text-shadow: 0 2px 8px #091125;
      text-transform: uppercase;
    }
    .corner-note strong {
      display: block;
      margin-top: 5px;
      color: #f9bba9;
      font-family: Georgia, serif;
      font-size: 21px;
      font-weight: 400;
      letter-spacing: .03em;
      text-transform: none;
    }
    .neon-core { animation: neon-breathe 5.5s ease-in-out infinite; }
    .neon-flicker { animation: neon-flicker 9s infinite; }
    .lantern { transform-origin: 819px 357px; animation: lantern-sway 5s ease-in-out infinite alternate; }
    .steam { fill: none; stroke: #fff9df; stroke-linecap: round; stroke-width: 4; opacity: .57; }
    .steam.one { animation: steam-rise 3.6s ease-out infinite; }
    .steam.two { animation: steam-rise 3.6s ease-out -1.2s infinite; }
    .steam.three { animation: steam-rise 3.6s ease-out -2.4s infinite; }
    .robot-eye { transform-box: fill-box; transform-origin: center; animation: blink 7s infinite; }
    .puddle-shine { animation: puddle-pulse 4s ease-in-out infinite alternate; }
    .rain-line {
      stroke-linecap: round;
      animation-name: rain-fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .still *, .still *::before, .still *::after { animation-play-state: paused !important; }
    @keyframes rain-fall {
      from { transform: translate3d(-18px, -100px, 0); opacity: 0; }
      23% { opacity: 1; }
      77% { opacity: 1; }
      to { transform: translate3d(26px, 135px, 0); opacity: 0; }
    }
    @keyframes neon-breathe {
      0%, 100% { opacity: .95; }
      50% { opacity: .7; }
    }
    @keyframes neon-flicker {
      0%, 77%, 79%, 81%, 100% { opacity: 1; }
      78%, 80% { opacity: .48; }
    }
    @keyframes lantern-sway {
      from { transform: rotate(-2deg); }
      to { transform: rotate(2deg); }
    }
    @keyframes steam-rise {
      from { transform: translateY(11px) scale(.83); opacity: 0; }
      24% { opacity: .68; }
      to { transform: translateY(-39px) scale(1.18); opacity: 0; }
    }
    @keyframes blink {
      0%, 46%, 49%, 100% { transform: scaleY(1); }
      47% { transform: scaleY(.13); }
    }
    @keyframes puddle-pulse {
      from { opacity: .48; }
      to { opacity: .8; }
    }
    @media (max-width: 700px) {
      .heading { top: 25px; left: 23px; max-width: 90vw; }
      h1 { margin-top: 10px; font-size: clamp(42px, 13vw, 70px); }
      .heading p { max-width: 250px; font-size: 11px; }
      .controls { left: 19px; bottom: 20px; gap: 6px; }
      .control { min-height: 37px; padding: 0 11px; font-size: 9px; gap: 6px; }
      .corner-note { right: 20px; bottom: 75px; font-size: 8px; }
      .corner-note strong { font-size: 16px; }
    }
    @media (max-width: 390px) {
      .corner-note { display: none; }
      .control { padding: 0 9px; font-size: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="heading">
      <div class="eyebrow">A small midnight story</div>
      <h1>Rainy <em>Ramen</em></h1>
      <p>One warm bowl, delivered beneath a borrowed sky.</p>
    </div>

    <svg class="art" id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="art-title art-desc">
      <title id="art-title">Rainy Ramen</title>
      <desc id="art-desc">Outside a glowing Japanese ramen shop at night, a cat server offers a steaming bowl of ramen to a small robot holding a transparent umbrella. Neon signs shine through the rain and reflect in the street.</desc>
      <defs>

        <radialGradient id="moonGlow">
          <stop stop-color="#b8f7f1" stop-opacity=".4"/>

        <linearGradient id="shopWall" x2=".95" y2="1">

        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2=".92" y2="1">
          <stop stop-color="#ffddaa"/>
          <stop offset=".42" stop-color="#d78d78"/>
          <stop offset="1" stop-color="#5b4567"/>
        </linearGradient>
        <radialGradient id="interiorLight">
          <stop stop-color="#ffe0a3" stop-opacity=".86"/>
          <stop offset="1" stop-color="#ffbd87" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="sign" x2="0" y2="1">
          <stop stop-color="#5a3248"/>
          <stop offset="1" stop-color="#3d3047"/>
        </linearGradient>
        <linearGradient id="road" x2="0" y2="1">
          <stop stop-color="#253a4b"/>
          <stop offset=".39" stop-color="#172a3d"/>
          <stop offset="1" stop-color="#101b33"/>
        </linearGradient>
        <linearGradient id="umbrella" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#f0ffff" stop-opacity=".71"/>
          <stop offset=".46" stop-color="#89dde7" stop-opacity=".34"/>
          <stop offset="1" stop-color="#7fb4df" stop-opacity=".49"/>
        </linearGradient>
        <linearGradient id="robot" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#d9e9e1"/>
          <stop offset=".5" stop-color="#a9c4c9"/>

        <linearGradient id="bowl" x2="0" y2="1">
          <stop stop-color="#fff5d8"/>
          <stop offset="1" stop-color="#d9c6b1"/>
        </linearGradient>
        <linearGradient id="catCoat" x2=".9" y2="1">
          <stop stop-color="#f4b67d"/>
          <stop offset="1" stop-color="#ce7a61"/>
        </linearGradient>
        <pattern id="brick" width="72" height="33" patternUnits="userSpaceOnUse">
          <path d="M0 0H72 M0 33H72 M0 0V16 M36 16V33 M72 0V16" fill="none" stroke="#151e31" stroke-opacity=".35" stroke-width="2"/>
        </pattern>
        <pattern id="windowDots" width="54" height="51" patternUnits="userSpaceOnUse">
          <rect x="12" y="13" width="12" height="16" rx="1" fill="#ffdca7" opacity=".25"/>
        </pattern>
        <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="13"/>
        </filter>
        <filter id="neonGlow" x="-60%" y="-80%" width="220%" height="260%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="13"/>
        </filter>
      </defs>

      </g>

      <rect x="129" y="339" width="75" height="253" rx="6" fill="#3b354c" stroke="#ef8298" stroke-width="4"/>
      <g class="neon-core" fill="#ff9aab" filter="url(#neonGlow)" text-anchor="middle" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="33" font-weight="700">
        <text x="166" y="389">ラ</text><text x="166" y="440">ー</text><text x="166" y="491">メ</text><text x="166" y="542">ン</text>
      </g>

        <ellipse cx="819" cy="424" rx="35" ry="51" fill="#ffad8b" opacity=".32" filter="url(#softGlow)"/>

      <g class="puddle-shine">
        <ellipse cx="420" cy="750" rx="177" ry="8" fill="#efb193" opacity=".32"/>

  <script>
    (function () {
      "use strict";
      const scene = document.getElementById("scene");
      const art = document.getElementById("art");
      const soundButton = document.getElementById("sound-toggle");
      const motionButton = document.getElementById("motion-toggle");
      const svgNS = "http://www.w3.org/2000/svg";
      let seed = 21417;
      function random() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }
      function makeRain(parent, count, near) {
        for (let i = 0; i < count; i += 1) {
          const x = random() * 1510 - 35;
          const y = random() * 1050 - 100;
          const length = (near ? 13 : 8) + random() * (near ? 23 : 15);
          const line = document.createElementNS(svgNS, "line");
          line.setAttribute("x1", x.toFixed(1));
          line.setAttribute("y1", y.toFixed(1));
          line.setAttribute("x2", (x - length * .21).toFixed(1));
          line.setAttribute("y2", (y + length).toFixed(1));
          line.setAttribute("stroke", near ? "#b9edf0" : "#91b9ca");
          line.setAttribute("stroke-width", near ? (1.3 + random() * 1.2).toFixed(1) : ".9");
          line.setAttribute("opacity", (near ? .29 + random() * .36 : .23 + random() * .34).toFixed(2));
          line.setAttribute("class", "rain-line");
          line.style.animationDuration = (near ? .85 + random() * .9 : 1.4 + random() * 1.4).toFixed(2) + "s";
          line.style.animationDelay = (-random() * 4).toFixed(2) + "s";
          parent.appendChild(line);
        }
      }
      makeRain(document.getElementById("rain-back"), 100, false);
      makeRain(document.getElementById("rain-front"), 55, true);

      const mobile = window.matchMedia("(max-width: 700px) and (orientation: portrait)");
      function setFrame() {
        art.setAttribute("viewBox", mobile.matches ? "560 -260 600 1298" : "0 0 1440 900");
      }
      setFrame();
      mobile.addEventListener("change", setFrame);

      motionButton.addEventListener("click", function () {
        const paused = scene.classList.toggle("still");
        motionButton.setAttribute("aria-pressed", String(paused));
        motionButton.querySelector("span").textContent = paused ? "Play scene" : "Pause scene";
      });

      let audioContext;
      let rainSource;
      let rainGain;
      function startRain() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          soundButton.querySelector("span").textContent = "Audio unavailable";
          soundButton.disabled = true;
          return;
        }
        audioContext = audioContext || new AudioContextClass();
        const seconds = 3;
        const length = Math.floor(audioContext.sampleRate * seconds);
        const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
        const channel = buffer.getChannelData(0);
        let last = 0;
        for (let i = 0; i < length; i += 1) {
          last = (last + (Math.random() * 2 - 1) * .12) * .985;
          channel[i] = last;
        }
        rainSource = audioContext.createBufferSource();
        rainSource.buffer = buffer;
        rainSource.loop = true;
        const lowpass = audioContext.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = 1250;
        rainGain = audioContext.createGain();
        rainGain.gain.value = 0;
        rainSource.connect(lowpass).connect(rainGain).connect(audioContext.destination);
        rainSource.start();
        rainGain.gain.setTargetAtTime(.26, audioContext.currentTime, .2);
        audioContext.resume();
      }
      function stopRain() {
        if (!rainSource || !audioContext) return;
        rainGain.gain.setTargetAtTime(0, audioContext.currentTime, .08);
        const oldSource = rainSource;
        window.setTimeout(function () { try { oldSource.stop(); } catch (_) {} }, 400);
        rainSource = null;
      }
      soundButton.addEventListener("click", function () {
        const playing = soundButton.getAttribute("aria-pressed") === "true";
        if (playing) stopRain();
        else startRain();
        if (!soundButton.disabled) {
          soundButton.setAttribute("aria-pressed", String(!playing));
          soundButton.querySelector("span").textContent = playing ? "Hear the rain" : "Mute rain";
        }
      });
      document.addEventListener("visibilitychange", function () {
        if (document.hidden && audioContext) audioContext.suspend();
        else if (!document.hidden && audioContext && rainSource) audioContext.resume();
      });
    }());
  </script>
